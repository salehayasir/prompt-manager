worker_processes  1;

# Keep nginx's own runtime files (logs, pid) inside nginx/logs, resolved
# relative to the -p prefix directory (the repo root) at startup:
#   nginx -p . -c nginx/nginx.conf
error_log  nginx/logs/error.log;
pid        nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Resolved relative to this config file's own directory (nginx/),
    # so it finds nginx/mime.types regardless of the -p prefix used.
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log nginx/logs/access.log;

    # Windows nginx does not auto-create these temp dirs like Linux does,
    # so they must exist on disk ahead of time (see nginx/temp/*/.gitkeep)
    # and be pointed at explicitly rather than left at their defaults.
    client_body_temp_path nginx/temp/client_body_temp;
    proxy_temp_path       nginx/temp/proxy_temp;
    fastcgi_temp_path     nginx/temp/fastcgi_temp;
    uwsgi_temp_path       nginx/temp/uwsgi_temp;
    scgi_temp_path        nginx/temp/scgi_temp;

    server {
        listen 80;
        server_name localhost;

        # Resolved relative to nginx's prefix directory (-p flag at startup).
        # Start nginx from the repo root with:
        #   nginx -p "$(pwd)" -c nginx/nginx.conf
        root  prompt-manager-ui/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/prompts {
            rewrite ^/api/prompts/?$ /prompts break;
            rewrite ^/api/prompts/(.+)$ /prompts/$1 break;
            proxy_pass http://localhost:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/reviews {
            rewrite ^/api/reviews/?$ /reviews break;
            rewrite ^/api/reviews/(.+)$ /reviews/$1 break;
            proxy_pass http://localhost:8001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth {
            rewrite ^/api/auth/?$ /auth break;
            rewrite ^/api/auth/(.+)$ /auth/$1 break;
            proxy_pass http://localhost:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}